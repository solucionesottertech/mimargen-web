<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- White background -->
  <rect width="64" height="64" fill="white"/>
  
  <!-- Simplified Pie Chart Background -->
  <g transform="translate(32, 32)">
    <!-- Three quarters of pie chart (forest green) -->
    <path d="M 0,0 L -18,0 A 18,18 0 1,1 0,18 Z" fill="#065F46"/>
    <path d="M 0,0 L 0,-18 A 18,18 0 0,0 -18,0 Z" fill="#065F46"/>
    <path d="M 0,0 L 0,18 A 18,18 0 0,0 18,0 Z" fill="#065F46"/>
    
    <!-- Pulled-out quarter slice (bright green) - simplified -->
    <path d="M 2,2 L 2,-16 A 18,18 0 0,1 20,2 Z" fill="#34D399" transform="translate(-2, -2)"/>
  </g>
  
  <!-- Simplified M Arrows (thinner strokes for small size) -->
  <g>
    <!-- First M -->
    <path d="M 18,46 L 23,25 L 30,35 L 37,22 L 42,40" 
          stroke="#10B981" 
          stroke-width="4" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          fill="none"/>
    <polygon points="37,22 34,27 40,27" fill="#10B981"/>
    
    <!-- Second M -->
    <path d="M 22,42 L 27,21 L 34,31 L 41,18 L 46,36" 
          stroke="#10B981" 
          stroke-width="4" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          fill="none"/>
    <polygon points="41,18 38,23 44,23" fill="#10B981"/>
  </g>
</svg>
